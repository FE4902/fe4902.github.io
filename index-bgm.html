<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --ink: #fff; --pink: #d84060; --cyan: #60d0e0; --yellow: #e8d020; }
  /* 스크롤바는 CRT 화면 밖의 요소라 숨긴다 (휠·터치 스크롤은 그대로) */
  html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
  body { margin: 0; background: #000; color: var(--ink); font: 14px/1.7 system-ui, sans-serif; }
  img, canvas { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
  /* 커서는 후처리 밖에서 3px 도트로 또렷하게 */

  .pixel-cursor svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  .pixel-cursor [data-shape="hand"], .pixel-cursor[data-hit="true"] [data-shape="arrow"] { display: none; }
  .pixel-cursor[data-hit="true"] [data-shape="hand"] { display: inline; }
  body::after { content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 65%, #00184730); }
  .px { font-family: 'Press Start 2P', monospace; }
  /* 점수 상태는 DOM에 보존, 화면 표시는 게임 후처리 안에서 */
  .hud { position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
         clip-path: inset(50%); white-space: nowrap; pointer-events: none; }
  .ride { height: 520vh; }
  /* 결승 도착: 화면 가운데 GAME CLEAR */
  .clear { position: fixed; top: 34%; left: 16px; right: 16px; z-index: 2; text-align: center; pointer-events: none; font-size: clamp(26px, 6vw, 56px);

  body.portal-mode { overflow: hidden; }

  /* 켤 때는 visibility 를 바로 바꿔야 도착 직후 focus() 가 먹는다 */
  .ending.on { opacity: 1; visibility: visible; transition-delay: 0s; }
  /* 웹툰·애니의 시스템 창: 허공에 뜬 푸른 반투명 알림 (테마 공통) */
  .system-window { --line: #6fd3ff; --text: #e6f6ff; box-sizing: border-box; width: min(480px, calc(100% - 32px)); max-height: calc(100dvh - 32px); padding: 0; background: #061a33d9 linear-gradient(180deg, #0f3a6a66, transparent 45%); color: var(--text); border: 1px solid var(--line); box-shadow: 0 0 0 1px #0b2f55, 0 0 26px #2f9dff66, inset 0 0 36px #2f9dff33; text-align: center; font-family: system-ui, sans-serif; overflow: hidden; outline: none; }
  .system-window::backdrop { background: #020a1659; }
  /* 네 모서리 강조선 */
  .system-window::after { content: ''; position: absolute; inset: 5px; pointer-events: none; --c: var(--line); background: linear-gradient(var(--c), var(--c)) 0 0/16px 2px, linear-gradient(var(--c), var(--c)) 0 0/2px 16px, linear-gradient(var(--c), var(--c)) 100% 0/16px 2px, linear-gradient(var(--c), var(--c)) 100% 0/2px 16px, linear-gradient(var(--c), var(--c)) 0 100%/16px 2px, linear-gradient(var(--c), var(--c)) 0 100%/2px 16px, linear-gradient(var(--c), var(--c)) 100% 100%/16px 2px, linear-gradient(var(--c), var(--c)) 100% 100%/2px 16px; background-repeat: no-repeat; }
  .system-window[open] { animation: system-appear .3s ease-out both; }
  .system-window[open] .system-line { animation: system-line .01s steps(1) both; animation-delay: calc(.34s + var(--i) * .22s); }
  .system-label { display: flex; align-items: center; justify-content: center; margin: 0 32px; padding: 22px 0 16px; border-bottom: 1px solid #6fd3ff55; color: var(--line); font-size: 15px; line-height: 1; font-weight: 700; letter-spacing: 6px; text-indent: 6px; }
  .system-screen { padding: 24px 32px 32px; }
  .system-log { margin: 0 0 10px; padding: 0; list-style: none; font-size: 15px; line-height: 1.7; text-shadow: 0 0 10px #2f9dffaa; word-break: keep-all; }
  .system-window h2 { margin: 0 0 28px; font-size: 23px; font-weight: 700; line-height: 1.4; color: #fff; text-shadow: 0 0 14px #6fd3ff99; word-break: keep-all; }
  .system-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .system-choices[hidden] { display: none; }

  .system-choices button:hover, .system-choices button:focus-visible { color: #04121f; background: var(--line); outline: none; box-shadow: 0 0 14px #6fd3ff80; }
  /* 거절하면 창 전체가 붉은 경고로 바뀐다 */
  .system-window[data-status="forced"] { --line: #ff7468; background: #2a0710d9 linear-gradient(180deg, #6a0f1f66, transparent 45%); box-shadow: 0 0 0 1px #551018, 0 0 26px #ff405066, inset 0 0 36px #ff405033; }
  .system-window[data-status="forced"] .system-label { border-color: #ff746855; }
  .system-window[data-status="forced"] .system-log { text-shadow: 0 0 10px #ff4050aa; }

  @keyframes system-appear { 0% { opacity: 0; transform: scale(.9, .02); } 55% { opacity: 1; transform: scale(1, .02); } 100% { opacity: 1; transform: none; } }
  @keyframes system-line { 0% { visibility: hidden; } 100% { visibility: visible; } }
  @media (max-width: 600px) { .system-label { margin: 0 24px; } .system-screen { padding: 20px 24px 26px; } .system-log { font-size: 14px; } .system-window h2 { font-size: 20px; } }
  /* 도착 화면: 공간에 뜬 아이템 4개(복셀) 위에 투명 버튼을 겹쳐 둔다. 위치는 arrivalSpace 가 매 프레임 맞춤 */
  /* 도착 화면은 모든 테마가 같다: 테마별로 바뀌는 --cyan·--yellow 대신 고정색 */
  .orbs { position: absolute; inset: 0; pointer-events: none; }
  .orb { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; box-sizing: border-box; padding: 0; color: #6fd3ff; background: none; border: 0; text-decoration: none; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  .orb-label { white-space: nowrap; font: 11px/1.4 'Press Start 2P', monospace; letter-spacing: 1px; padding: 6px 8px; background: #04121fe8; border: 1px solid #6fd3ff55; text-shadow: 0 0 8px #2f9dffaa; transition: opacity .2s; }
  /* 연락처 라벨은 작고 옅게. 호버 규칙보다 앞에 둬야 호버 때 다른 메뉴와 같은 색이 된다 */
  .orb[data-orb="2"] .orb-label, .orb[data-orb="3"] .orb-label { font-size: 10px; color: #a3c6d6; }
  .orb:hover .orb-label, .orb:focus-visible .orb-label { color: #04121f; background: #6fd3ff; text-shadow: none; }

  /* 코앞을 떠 가는 캐릭터에 가려진 메뉴: 이름표를 숨기고 클릭은 캐릭터로 */
  .orb.covered { pointer-events: none; } .orb.covered .orb-label { opacity: 0; }
  /* PROFILE · PROJECTS 를 누르면 뜨는 창 (시스템 창과 같은 모양) */

  .status-intro { margin: 14px 0 0; font-size: 14px; line-height: 1.7; word-break: keep-all; }
  .status-role { margin: 0 0 4px; font: 9px/1.6 'Press Start 2P', monospace; letter-spacing: 2px; color: #e8d020; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .slot svg { width: 48%; max-width: 64px; height: auto; shape-rendering: crispEdges; }

  .status-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .status-links a { padding: 7px 12px; border: 1px solid var(--line); color: var(--text); background: #0d355f80; text-decoration: none; font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: 1px; }
  .status-links a:hover, .status-links a:focus-visible { color: #04121f; background: var(--line); outline: none; }
  @media (max-width: 680px) { .status-body { grid-template-columns: 1fr; padding: 18px 20px 4px; } .info-window .system-label { margin: 0 52px 0 20px; } }
  /* CRT의 검은 모서리를 피해 화면 안쪽에 두는 조작 안내 */
  .scroll { position: fixed; right: max(24px, 6vw, env(safe-area-inset-right)); bottom: max(24px, 6vh, env(safe-area-inset-bottom));
            z-index: 2; font-size: 11px; opacity: .75; pointer-events: none; user-select: none; }
  body:has(.clear.on) .scroll { visibility: hidden; }

    .system-window[open] .status-part { animation: none; } .orb-label { transition: none; }
  }

  .scroll { text-shadow: 2px 2px #0038ad; font-size: 10px; }
  .intro { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; background: #00245d40; }

  .title-card { width: min(92%, 720px); padding: 36px 0; color: #fff; text-shadow: 3px 3px #003393; }
  .title-kicker { font-size: 10px; line-height: 1.5; letter-spacing: 3px; margin: 0 0 12px; }
  h1 { font-size: clamp(26px, 5.6vw, 60px); line-height: 1.25; margin: 0 0 24px; color: #fff; text-shadow: 4px 4px #143eaa, -2px -2px #143eaa; }

  .start { box-sizing: border-box; width: clamp(180px, 24vw, 232px); max-width: 100%; min-height: 48px; cursor: pointer; border: 0; background: #081e68; color: #fff; padding: 14px 24px; font-size: clamp(10px, 1.2vw, 12px); line-height: 1.5; box-shadow: 4px 4px #003393; }
  .start:hover { background: #0a36ad; color: #ffed55; } .start:disabled { cursor: wait; opacity: .65; }

  /* 게임 HUD와 같은 도트·팔레트. CRT 테두리 안쪽에 배치한다. */
  .sound-controls { --sound-ink: #e8d020; --sound-dim: #786c30; position: fixed; right: max(6.5vw, env(safe-area-inset-right)); bottom: max(5.5vh, env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; gap: 10px; height: 44px; color: var(--sound-ink); font: 8px/1 'Press Start 2P', monospace; user-select: none; -webkit-user-select: none; filter: drop-shadow(2px 2px 0 #101820); }
  .scroll { bottom: calc(max(5.5vh, env(safe-area-inset-bottom)) + 54px); }

<script id="arcade-bgm">
(() => {

    'G4 G4 G4:.5 F#4:.5 G4:.5 A4:.5', 'B4 B4 B4:.5 A#4:.5 B4:.5 C5:.5',
    'D5 D5 D5:.5 C#5:.5 D5:.5 G5:.5', 'D5:3 B4',

    'E5 D5 C5 B4', 'A4 G4 F#4 G4', 'A4 B4:.5 C5:.5 B4 A4', 'G4 D4:.5 E4:.5 F#4:.5 G4:.5 A4:.5 B4:.5',
    'C5 C5 C5 C5', 'C5:.5 B4:.5 C5:2 C#5', 'D5 D5 D5:.5 C5:.5 B4:.5 C5:.5', 'D5:3 B4',
    'C5 C5 C5 C5', 'C5:.5 B4:.5 C5:2 C#5', 'D5 D5 D5:.5 C5:.5 B4:.5 C5:.5', 'D5:3 D5',
    'E5 E5 G5:1.5 E5:.5', 'D5 D5 D5:.5 C5:.5 B4', 'C5 C5 F#4 C5', 'B4 B4 B4:.5 A4:.5 G4',
    'E5 E5 G5:1.5 E5:.5', 'D5 D5 D5:.5 C5:.5 B4', 'C5 C5 F#4 A4', 'G4:3 R',
  ];
  const skaters = [
    'C#5:3', 'E5:2 F#5', 'F#5:3', 'F#5:3', 'D5:3', 'F#5:2 G#5', 'G#5:3', 'G#5:3',
    'B5:3', 'A5:2 C#5', 'E5:3', 'D5:2 C#5', 'C#5:3', 'B4:3', 'A4:3', 'A4 R:2',
    'E5:.5 A5:.5 F#5:.5 A5:.5 E5:.5 A5:.5', 'F#5:.5 A5:.5 E5:.5 A5:.5 F#5:.5 A5:.5',
    'E5 G#5:.5 R:.5 G#5:.5 R:.5', 'E5 G#5:.5 R:.5 G#5:.5 R:.5',
    'E5:.5 B5:.5 F#5:.5 B5:.5 E5:.5 B5:.5', 'F#5:.5 B5:.5 E5:.5 B5:.5 F#5:.5 B5:.5',
    'E5 A5:.5 R:.5 A5:.5 R:.5', 'E5 A5:.5 R:.5 A5:.5 R:.5',
    'E5:.5 A5:.5 F#5:.5 A5:.5 E5:.5 A5:.5', 'F#5:.5 A5:.5 E5:.5 A5:.5 F#5:.5 A5:.5',
    'E5 G#5:.5 R:.5 G#5:.5 R:.5', 'E5 G#5:.5 R:.5 G#5:.5 R:.5',
    'G#5:.5 A5:.5 G#5:.5 A5:.5 G#5:.5 A5:.5', 'G#5:.5 A5:.5 G#5:.5 A5:.5 G#5:.5 A5:.5',
    'G#5:.5 A5:.5 G#5:.5 A5:.5 G#5:.5 A5:.5', 'G#5:.5 A5:.5 G#5:.5 A5:.5 G#5:.5 B5:.5',
  ];
  const dino = [
    'E4:.5 R:.5 E5:.5 D5:.5 B4 E4', 'G4:.5 A4:.5 B4 E5:.5 D5:.5 B4',
    'E4:.5 R:.5 G5:.5 E5:.5 D5 B4', 'A4:.5 B4:.5 D5 B4:.5 A4:.5 G4',
    'C5:.5 R:.5 E5:.5 G5:.5 E5 D5', 'C5:.5 B4:.5 A4 G4:.5 E4:.5 G4',
    'D5:.5 R:.5 F#5:.5 E5:.5 D5 A4', 'B4:.5 A4:.5 F#4 B4:.5 D#5:.5 B4',
    'E5:.5 B4:.5 E5:.5 G5:.5 E5 D5', 'B4:.5 G4:.5 B4 D5:.5 E5:.5 G5',
    'E5:.5 R:.5 D5:.5 B4:.5 G4 B4', 'A4:.5 B4:.5 D5 E5:.5 D5:.5 B4',
    'G5:.5 E5:.5 C5 E5:.5 D5:.5 C5', 'A4:.5 C5:.5 E5 G5:.5 E5:.5 D5',
    'F#5:.5 D5:.5 A4 D5:.5 E5:.5 F#5', 'B4 D#5 E5 R',
  ];
  const chords = {
    G: ['G2','D3','B3','D4'], D: ['D3','A2','F#3','C4'], A: ['A2','E3','C#4','E4'],
    C: ['C3','G2','E4','G4'], Am: ['A2','E3','C4','E4'], Em: ['E3','B2','G3','B3'],
    F: ['F2','C3','A3','C4'], E: ['E3','B2','G#3','D4'], B: ['B2','F#3','D#4','F#4'],
    Fsm: ['F#2','C#3','A3','C#4'], Csm: ['C#3','G#2','E4','G#4'], Dim: ['D#3','A2','F#3','C4'],
  };
  const scores = {
    circus: { bpm: 180, meter: 4, bars: patrol, harmony: 'G G G G D G A D G G G G C Am D G D D G G D D G G C G Dim Em C G D G'.split(' '), voice: 'pulse', level: .17 },
    antarctic: { bpm: 210, meter: 3, bars: skaters, harmony: 'A A D D D E E E E A A D A E A A A A E E E E A A A A E E E E E E'.split(' '), voice: 'square', level: .13 },
    dino: { bpm: 156, meter: 4, bars: dino, harmony: 'Em Em Em D C Am D B Em Em Em D C Am D B'.split(' '), voice: 'pulse', level: .16 },
    arrival: { bpm: 92, meter: 4, voice: 'triangle', level: .16,
      bars: ['E5:2 G5 B5','A5:2 E5:2','G5:2 E5 D5','B4:3 R','C5:2 E5 G5','E5:2 D5:2','D5:2 G5 F#5','E5:3 R',
        'G5:2 B5 D6','C6:2 B5 A5','G5:2 E5:2','D5:3 R','E5:2 G5 E5','C5:2 E5:2','D5:2 B4 D5','E5:3 R'],
      harmony: 'C Am Em G C Am D Em C Am Em G C Am D Em'.split(' ') },
    clear: { bpm: 240, meter: 4, voice: 'pulse', level: .15, once: true,
      bars: ['C5:.5 E5:.5 G5:.5 C6:2 R:.5'], harmony: ['C'] },
  };
  const hz = name => {
    const [, letter, sharp, octave] = /^([A-G])(#?)(\d)$/.exec(name);
    const midi = (Number(octave) + 1) * 12 + {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[letter] + (sharp ? 1 : 0);
    return 440 * 2 ** ((midi - 69) / 12);
  };
  const buffers = new Map();
  // 한 바퀴를 미리 합성해 GPU 부하·프레임률과 독립적으로 반복한다.
  async function render(key) {

    const offline = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, Math.ceil(duration * 44100), 44100);
    const filter = offline.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = key === 'arrival' ? 2600 : 5200;

      const osc = offline.createOscillator(), gain = offline.createGain();
      if (voice === 'pulse') osc.setPeriodicWave(pulse); else osc.type = voice;
      osc.frequency.value = hz(pitch);

      gain.gain.setValueAtTime(volume * .75, Math.max(start + .005, end - .025)); gain.gain.linearRampToValueAtTime(0, end);
      osc.connect(gain); gain.connect(filter); osc.start(start); osc.stop(end + .001);
    };
    song.bars.forEach((bar, i) => {
      let pos = i * song.meter;
      for (const token of bar.split(' ')) { const [pitch, len] = token.split(':'); const n = Number(len || 1); note(pitch, pos, n, song.voice, song.level); pos += n; }
      if (Math.abs(pos - (i + 1) * song.meter) > .00001) throw Error(`BGM 박자 확인: ${key} ${i + 1}`);
      const chord = chords[song.harmony[i]], base = i * song.meter, quiet = key === 'arrival';
      note(chord[0], base, quiet ? 1.5 : .7, 'triangle', quiet ? .10 : .23);
      if (song.meter === 4) note(chord[1], base + 2, .7, 'triangle', quiet ? .08 : .18);
      for (const b of song.meter === 3 ? [1,2] : [1,3]) {
        note(chord[2], base + b, quiet ? .75 : .38, quiet ? 'triangle' : 'pulse', quiet ? .055 : .035);
        note(chord[3], base + b + (quiet ? .25 : 0), quiet ? .5 : .38, quiet ? 'triangle' : 'pulse', quiet ? .045 : .025);
      }
      if (key === 'dino') for (let b = 0; b < 4; b += .5) note(chord[b % 1 ? 1 : 0], base + b, .18, 'triangle', .10);
    });
    return offline.startRendering();
  }
  function bufferFor(key) {
    if (!buffers.has(key)) buffers.set(key, render(key).catch(error => { buffers.delete(key); throw error; }));
    return buffers.get(key);
  }

  const button = document.getElementById('sound-toggle'), controls = document.getElementById('sound-controls');
  const volumeInput = document.getElementById('sound-volume'), level = document.getElementById('sound-level');
  let volume = .55, previousVolume = .55;
  const intro = document.getElementById('intro'), clear = document.getElementById('clear');
  const Audio = window.AudioContext || window.webkitAudioContext;
  let context, master, current, active = false, enabled = true, wanted = 'silent', offset = 0, revision = 0, finished = false, failed = false;
  const available = Audio && (window.OfflineAudioContext || window.webkitOfflineAudioContext);
  // 테마별 짧은 합성음. 상대 음량은 별도로, 사용자 음량·음소거는 BGM과 함께 적용한다.
  const sfxLevel = .7, sfxBuffers = new Map(), voices = new Set(), lastEffect = new Map();
  const timbres = {
    circus: { wave: 'pulse', pitch: 1, jump: [240, 880, .18], click: [660, 330, .12] },
    antarctic: { wave: 'triangle', pitch: 1.25, jump: [480, 1080, .14], click: [940, 470, .12] },
    dino: { wave: 'square', pitch: .8, jump: [210, 610, .11], click: [400, 180, .09] },
    arrival: { wave: 'triangle', pitch: 1, jump: [400, 900, .16], click: [880, 660, .1] },
  };
  function effectBuffer(kind, theme) {
    const key = `${theme}:${kind}`;
    if (sfxBuffers.has(key)) return sfxBuffers.get(key);
    const tone = timbres[theme], p = tone.pitch;
    const notes = {
      jump: [tone.jump], click: [tone.click],
      spin: [[330, 990, .13], [990, 440, .13], [440, 1320, .15]],
      bonus: [[660 * p, 660 * p, .065], [880 * p, 880 * p, .065], [1320 * p, 1320 * p, .13]],
      open: [[523, 523, .06], [784, 784, .11]],
      close: [[660, 660, .05], [392, 392, .09]],
      send: [[330, 1760, .28]], select: [[1046, 784, .065]],
      stomp: [[130, 48, .2]],
    }[kind];

    const rate = context.sampleRate, length = notes.reduce((sum, n) => sum + n[2], 0);
    const buffer = context.createBuffer(1, Math.ceil(length * rate), rate), data = buffer.getChannelData(0);
    let offset = 0;
    for (const [from, to, duration] of notes) {
      const count = Math.floor(duration * rate); let phase = 0;
      for (let i = 0; i < count; i++) {

        // 작은 음정 계단으로 미끄러지는 옛 아케이드 음색.
        const step = Math.floor(u * 24) / 24, freq = from * (to / from) ** step;
        phase += freq / rate;
        let value = 0;
        for (let harmonic = 1; harmonic <= 7; harmonic++) {

          const coefficient = tone.wave === 'pulse' ? Math.sin(harmonic * Math.PI / 4) / harmonic

        data[offset + i] = value * envelope * .22;
      }
      offset += count;
    }
    sfxBuffers.set(key, buffer); return buffer;
  }
  function stopEffects(immediate = false) {
    for (const voice of voices) {
      const now = context.currentTime;
      voice.gain.gain.cancelScheduledValues(now);
      voice.gain.gain.setValueAtTime(immediate ? 0 : voice.gain.gain.value, now);
      voice.gain.gain.linearRampToValueAtTime(0, now + .012);
      voice.node.stop(immediate ? now : now + .015);
    }
    voices.clear(); lastEffect.clear();
  }
  function sfx(kind, theme = document.body.dataset.theme) {
    if (!active || !enabled || volume === 0 || failed || document.hidden || context?.state !== 'running') return false;
    theme = timbres[theme] ? theme : 'arrival';
    const now = context.currentTime, key = `${theme}:${kind}`;
    if (now - (lastEffect.get(key) ?? -Infinity) < .09 || voices.size >= 4) return false;

      const buffer = effectBuffer(kind, theme); if (!buffer) return false;
      const node = context.createBufferSource(), gain = context.createGain(), voice = { node, gain };

  }

  function rideSounds(theme, jumps, rewards) {
    let frontier = null;
    return z => {
      if (frontier === null) { frontier = z; return; }
      if (z >= frontier) return;
      const before = frontier; frontier = z;
      if (before - z > 12) return;
      const crossed = at => before > at && z <= at;
      if (jumps.some(crossed)) sfx('jump', theme);
      if (rewards.some(crossed)) sfx('bonus', theme);
    };
  }
  function paint() {
    const blocked = active && enabled && (!context || context.state !== 'running');
    button.dataset.sound = !available || failed ? 'unavailable' : !enabled ? 'muted' : document.hidden ? 'paused' : blocked ? 'blocked' : current ? 'playing' : 'ready';
    button.setAttribute('aria-pressed', String(enabled && volume > 0 && !blocked));
    button.setAttribute('aria-label', !available || failed ? '게임 소리 재생 불가' : !enabled || blocked || !volume ? '게임 소리 켜기 (M)' : '게임 소리 끄기 (M)');
    button.dataset.zero = String(volume === 0);
    button.querySelector('.sound-state').textContent = !available || failed ? '--' : !enabled || !volume || blocked ? 'OFF' : 'ON';
    controls.dataset.muted = String(!enabled || volume === 0);
    volumeInput.value = String(Math.round(volume * 100));
    volumeInput.setAttribute('aria-valuetext', `${Math.round(volume * 100)}%`);
    level.value = String(Math.round(volume * 100)).padStart(2, '0');

  }
  function stop(remember = false) {
    if (!current) return;

    if (remember) offset = (old.offset + Math.max(0, context.currentTime - old.at)) % old.node.buffer.duration;
    const now = context.currentTime;
    old.gain.gain.cancelScheduledValues(now); old.gain.gain.setValueAtTime(old.gain.gain.value, now);

  }

      const buffer = await bufferFor(key);

  function syncScene() {

    const phase = document.body.dataset.portal;

    paint();
  }
  function wake() {
    if (!available || failed || !active || !enabled || document.hidden) { paint(); return; }
    try {
      if (!context) {
        context = new Audio({ latencyHint: 'playback' }); master = context.createGain(); master.gain.value = volume; master.connect(context.destination);
        context.addEventListener('statechange', () => { paint(); if (context.state === 'running') play(); });
      }

    volume = Math.max(0, Math.min(1, Number(value) / 100));

    else stopEffects();

    if (master) master.gain.setTargetAtTime(volume, context.currentTime, .015);
    paint();

// 노이즈 0.7초 → 시스템 창(수락 / 거절·20초 무응답은 붉은 경고 3초 뒤 강제) → 통로 → 도착 화면
function enterPortal({ renderer, composer, post, reduced }) {
  if (document.body.classList.contains('portal-mode')) return;
  onClear();
  // 디더 전환·HUD 없이 마지막 화면을 굳힌다 (검은 점이 통로에 남지 않게).
  const empty = new THREE.DataTexture(new Uint8Array(4), 1, 1); empty.needsUpdate = true;
  post.uniforms.hudMap.value = empty; post.uniforms.wipe.value = 0; composer.render();
  const still = document.createElement('canvas');
  still.width = renderer.domElement.width; still.height = renderer.domElement.height;
  still.getContext('2d').drawImage(renderer.domElement, 0, 0);
  const frame = new THREE.CanvasTexture(still);
  frame.magFilter = frame.minFilter = THREE.NearestFilter; frame.generateMipmaps = false;
  const material = new THREE.ShaderMaterial({
    uniforms: { frame: { value: frame }, amount: { value: 0 }, noise: { value: 1 }, glitch: { value: .8 }, glitchTime: { value: 0 }, reduced: { value: 0 },
                aspect: { value: innerWidth / innerHeight }, resolution: { value: new THREE.Vector2(still.width, still.height) } },
    vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader: PORTAL_SHADER,
  });
  const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), u = material.uniforms;
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
  document.body.classList.add('portal-mode');
  document.getElementById('clear').classList.remove('on');

  const system = document.getElementById('system'), choices = system.querySelector('.system-choices');
  const setCopy = ({ status, log, title }) => {
    system.querySelector('.system-label b').textContent = status;
    system.querySelector('.system-log').innerHTML = log.map((line, i) => `<li class="system-line" style="--i:${i}">${line}</li>`).join('');
    document.getElementById('system-question').innerHTML = title;
  };
  setCopy(SYSTEM_COPY.ask);
  let phase, phaseAt;
  const go = next => { phase = next; phaseAt = performance.now(); document.body.dataset.portal = next; };
  go('noise');
  // 거절하거나 오래 응답이 없으면 안내를 읽을 시간을 준 뒤 강제로 보낸다.
  const force = reason => {
    go('refusal'); system.dataset.status = 'forced'; setCopy(reason === 'idle' ? SYSTEM_COPY.idle : SYSTEM_COPY.forced);
    choices.hidden = true; system.tabIndex = -1; system.focus({ preventScroll: true });
  };
  const transfer = () => { go('playing'); if (system.open) system.close(); };
  const choose = choice => { if (phase === 'choice') choice === 'no' ? force('no') : transfer(); };
  system.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => choose(b.dataset.choice)));
  system.addEventListener('cancel', e => { e.preventDefault(); choose('no'); });   // Esc = 거절
  // 클릭 없이 스크롤만 했으면 브라우저가 Esc 취소를 막지 못하고 창을 닫는다 → 다시 띄워 거절로 처리
  system.addEventListener('close', () => {
    if (phase !== 'choice' && phase !== 'refusal') return;
    system.showModal(); choose('no');
  });

  const resize = () => {
    const px = innerWidth < 600 ? 2 : 3, w = Math.round(innerWidth / px), h = Math.round(innerHeight / px);
    renderer.setSize(w, h, false); u.aspect.value = innerWidth / innerHeight; u.resolution.value.set(w, h);
  };
  addEventListener('resize', resize); resize();
  const draw = () => { renderer.setRenderTarget(null); renderer.render(scene, camera); };
  // tools/shot.py 가 테마 루프만 계측하도록 루프 머리 형태를 다르게 둔다
  const tick = () => {
    const now = performance.now(), elapsed = now - phaseAt, calm = reduced();
    u.glitchTime.value = calm ? 0 : now / 1000; u.reduced.value = calm ? 1 : 0;
    if (phase === 'noise') {
      const k = Math.min(1, elapsed / 700);
      u.noise.value = 1 - k * .35;
      u.glitch.value = .8;
      if (k === 1) { go('choice'); system.showModal(); }
    } else if (phase === 'choice') {
      u.noise.value = .55;   // 팝업 뒤에도 도트 잡음을 선명하게 유지
      u.glitch.value = calm ? .65 : .22 + .45 * Math.exp(-elapsed / 250);
      if (elapsed >= PORTAL_IDLE) force('idle');
    } else if (phase === 'refusal') {
      u.noise.value = .65;
      u.glitch.value = .35;
      if (elapsed >= 3000) transfer();
    } else if (phase === 'playing') {
      const k = Math.min(1, elapsed / ((calm ? .7 : PORTAL_DURATION) * 1000));
      u.amount.value = k; u.noise.value = .18 * (1 - k);
      u.glitch.value = 0;
      if (k === 1) {
        go('ended'); removeEventListener('resize', resize);   // 통로의 마지막 어둠에서 디지털 공간이 이어진다
        arrivalSpace({ renderer, reduced });
        document.getElementById('ending').classList.add('on');
        document.querySelector('.orb').focus({ preventScroll: true });
        return;
      }
    }
    draw();
  };
  renderer.setAnimationLoop(tick);
  return tick;   // 검수 도구가 시계를 고정하고 한 프레임씩 돌릴 수 있게
}

  const dark = new THREE.Color(0x06070a);   // 통로가 끝나는 어둠과 같은 색

  // 격자 바닥: 카메라 뒤로 넘어가는 선은 일부 GPU 에서 사라지므로 카메라 앞(z 8)에서 끊는다
  const lines = [], gridColors = [], gridInk = new THREE.Color(0x337b9c);
  const gridPoint = (x, z) => {
    lines.push(x, 0, z);
    const fade = 1 - THREE.MathUtils.smoothstep(-z, 4, 32);

  const walker = { kind: null, n: 0, dir: 1, x: 0, z: -18, farZ: -18, y: 0, close: false, end: 0, speed: 0, jumpAt: -1, nextAt: performance.now() + 2500 };
  const walkPoint = new THREE.Vector3();
  const spawnWalker = () => {

    // 매번 다른 깊이·방향. 이상해 보이지 않게: 늘 화면 밖에서 들어와 밖으로 나가고, 발은 바닥(y 0),
    // 깊이는 메뉴 뒤(z −13 ~ −30)에서 직전과 5 이상 떨어진 곳, 진행은 화면과 나란히
    // 가끔(첫 등장 제외, 연속 없이 1/4) 바닥이 아니라 카메라 코앞(z 4.5~6)을 둥실 떠서 빠르게 스쳐 간다

    walker.dir = Math.random() < .5 ? 1 : -1;
    const halfW = (10 - z) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    walker.end = halfW + w;
    walker.x = -walker.dir * walker.end;
    walker.speed = 2 * walker.end / (walker.close ? Math.min(5, Math.max(3, 2 * walker.end / (3 * k.pace)))
                                                  : Math.min(16, Math.max(6, 2 * walker.end / (3.2 * k.pace))));

    return walkAlpha.get(img)[(Math.floor(v * img.height) * img.width + Math.floor(u * img.width)) * 4 + 3] > 0;
  };
  const endingEl = document.getElementById('ending');
  endingEl.addEventListener('pointermove', e => { endingEl.style.cursor = !e.target.closest('.orb') && walkerHit(e) ? 'pointer' : ''; });
  endingEl.addEventListener('click', e => {
    if (e.target.closest('.orb') || !walkerHit(e)) return;
    if (walker.jumpAt < 0) { walker.jumpAt = performance.now(); window.arcadeBgm.sfx('jump', walker.kind); }   // 클릭 반응: 움직임 줄이기와 무관
  });

  const measureLabels = () => orbs.forEach((el, i) => { labelSize[i] = [el.firstElementChild.offsetWidth, el.firstElementChild.offsetHeight]; });
  const resize = () => {

    });
    bits.instanceMatrix.needsUpdate = true;
    // 큰 움직임(카메라 흔들림·상자 회전)은 움직임 줄이기에서 멈춘다
    const sway = calm ? 0 : t;

    camera.lookAt(0, 4.5, -30);

      const driftX = calm ? 0 : Math.sin(t * .38 + i * 2.1) * .12;

      let y = it.base.y + bob, spin = it.turn + (calm ? 0 : Math.sin(t * .65 + i * 2) * .18) + (calm ? 0 : it.hover * Math.sin(t * 5) * .18);
      let size = it.fit * (1 + it.hover * .08), sx = 1, sy = 1;
      if (it.hopAt >= 0) {

      }

      const w = Math.max(64, right - left + 16, labelW + 8), h = bottom - top + 10 + labelH + 8;
      Object.assign(orbs[i].style, { width: `${w}px`, height: `${h}px`, transform: `translate(${(left + right - w) / 2}px, ${top - 8}px)` });
      it.label = [(left + right - labelW) / 2, top - 8 + h - labelH, labelW, labelH];   // 이름표의 화면 상자
    });

    if (!walker.kind && now >= walker.nextAt) spawnWalker();

      walker.x += walker.dir * walker.speed * dt;

      let lift = calm ? 0 : walker.close ? Math.sin(t * 2.2) * .25 : Math.abs(Math.sin(t * 7)) * .12, map = k.tex[side][Math.floor(t * 8) % k.tex[side].length];

      walkSprite.material.rotation = calm || walker.jumpAt >= 0 ? 0 : walker.close ? Math.sin(t * 1.6) * .1 : walker.kind === 'antarctic' ? Math.sin(t * 9) * .12 : 0;

    const cover = walker.kind && walker.close ? walkerRect() : null;
    items.forEach((it, i) => {
      const [lx, ly, lw, lh] = it.label;
      const covered = !!cover && [[.5, .5], [0, 0], [1, 0], [0, 1], [1, 1]].some(([a, b]) => walkerOpaque(cover, lx + lw * a, ly + lh * b));

  renderer.setAnimationLoop(drift);
  return drift;
}


// ---------- 인게임 HUD: 같은 저해상도·CRT 안에서 표시 ----------
function gameHUD(post) {
  const surface = document.createElement('canvas'), ctx = surface.getContext('2d');
  const texture = new THREE.CanvasTexture(surface);
  texture.magFilter = texture.minFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  post.uniforms.hudMap = { value: texture };
  // 5×7 고정 도트: 폰트 로딩·안티앨리어싱 없이 무대 도트와 맞춘다.
  const glyphs = {
    '0': [14,17,17,17,17,17,14], '1': [4,12,4,4,4,4,14], '2': [14,17,1,2,4,8,31],
    '3': [30,1,1,14,1,1,30], '4': [2,6,10,18,31,2,2], '5': [31,16,16,30,1,1,30],
    '6': [14,16,16,30,17,17,14], '7': [31,1,2,4,8,8,8], '8': [14,17,17,14,17,17,14],
    '9': [14,17,17,15,1,1,14], 'A': [14,17,17,31,17,17,17], 'D': [30,17,17,17,17,17,30],
    'E': [31,16,16,30,16,16,31], 'F': [31,16,16,30,16,16,16], 'G': [14,17,16,23,17,17,15],
    'H': [17,17,17,31,17,17,17], 'I': [14,4,4,4,4,4,14], 'K': [17,18,20,24,20,18,17],
    'L': [16,16,16,16,16,16,31], 'M': [17,27,21,21,17,17,17], 'P': [30,17,17,30,16,16,16],
    'R': [30,17,17,30,20,18,17], 'S': [15,16,16,14,1,1,30], 'T': [31,4,4,4,4,4,4],
    '/': [1,2,2,4,8,8,16], ' ': [0,0,0,0,0,0,0],
  };
  function text(str, center, y, color) {
    const x = Math.round(center - (str.length * 6 - 1) / 2);
    const draw = (dx, dy, ink) => {
      ctx.fillStyle = ink;
      [...str].forEach((ch, i) => (glyphs[ch] || glyphs[' ']).forEach((row, gy) => {
        for (let gx = 0; gx < 5; gx++) if (row & (1 << (4 - gx))) ctx.fillRect(x + i * 6 + gx + dx, y + gy + dy, 1, 1);
      }));
    };
    // 불빛·눈 위에서도 읽히도록 사방 테두리
    const edge = theme === 'circus' ? '#000' : '#0038ad';
    [[1, 1], [-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dx, dy]) => draw(dx, dy, edge));
    draw(0, 0, color);
  }
  let previous = '';
  const score = document.getElementById('score'), distance = document.getElementById('distance');
  const flags = document.getElementById('flags'), speed = document.getElementById('speedbar');
  return () => {
    const { x: w, y: h } = post.uniforms.res.value;
    const visible = started && !document.body.classList.contains('waiting') && !document.body.classList.contains('portal-mode');
    const level = Math.round((Number(speed.style.opacity || .35) - .35) / .65 * 8);
    const finished = document.getElementById('clear').classList.contains('on');
    const state = [w, h, visible, finished, score.textContent, distance.textContent, flags.textContent, level].join('|');
    if (state === previous) return;
    previous = state;
    if (surface.width !== w || surface.height !== h) { surface.width = w; surface.height = h; }
    ctx.clearRect(0, 0, w, h);
    if (visible) {
      const span = Math.min(w - 28, 360), left = (w - span) / 2, top = Math.max(14, Math.round(h * .065));
      const columns = [left + span / 6, w / 2, left + span * 5 / 6];
      const label = theme === 'circus' ? '#d84060' : '#ffed55';
      [['1P', score.textContent], ['HI', String(Math.max(20000, Number(score.textContent))).padStart(6, '0')], ['STAGE', String(stageNumber).padStart(2, '0')]].forEach(([name, value], i) => {
        text(name, columns[i], top, label);
        text(value, columns[i], top + 11, '#fff');
      });
      if (theme === 'antarctic' && !finished) {   // 도착하면 올라간 깃발을 가리지 않게 거둔다
        text('REST ' + distance.textContent + 'KM', columns[0] + 8, top + 27, '#fff');
        text('FLAGS ' + flags.textContent + '/3', w < 300 ? columns[2] - 8 : columns[1], top + 27, '#fff');
        if (w >= 300) {
          text('SPEED', columns[2], top + 27, '#fff');
          for (let i = 0; i < 8; i++) {
            ctx.fillStyle = i < level ? '#ffed55' : '#0038ad';
            ctx.fillRect(Math.round(columns[2] - 15 + i * 4), top + 37, 2, 3);
          }
        }
      }
    }
    texture.needsUpdate = true;
  };
}

async function runCircus() {

  if(clearEl.classList.contains('on'))clearScore.textContent=scoreEl.textContent;
  distanceEl.textContent=String(Math.round((1-state.progress)*124)).padStart(3,'0');flagsEl.textContent=state.collected;
  document.getElementById('speedbar').style.opacity=.35+clamp(speed/8)*.65;
  const cleared=started&&state.cleared;
  if(cleared!==shown){
    clearTimeout(portalTimer);clearTimeout(revealTimer);clearEl.classList.remove('on');clearEl.setAttribute('aria-hidden','true');
    if(cleared){
      // 반전 장면을 먼저 보여 준 뒤 클리어·전송 순서를 잇는다.
      wipeT=0;
      revealTimer=setTimeout(()=>{
        clearScore.textContent=scoreEl.textContent;clearEl.classList.add('on');clearEl.setAttribute('aria-hidden','false');
        portalTimer=setTimeout(toPortal,1500);
      },2800);
    }
    shown=cleared;
  }
  const u=post.uniforms;wipeT+=dt;u.time.value=t;u.wipe.value=reduce||wipeT>=.5?0:Math.sin(Math.PI*wipeT/.5)*.7;u.motion.value=reduce?0:1;u.night.value=state.night;
  updateHUD();
  composer.render();
});
}

try {
  await ({ circus: runCircus, antarctic: runAntarctic, dino: runDino }[theme])();
} catch (error) {
  console.error(error); startButton.textContent = '다시 불러오기'; startButton.disabled = false;
  startButton.addEventListener('click', () => location.reload(), { once: true });
  document.getElementById('intro-help').hidden = false;
  document.getElementById('intro-help').textContent = '화면을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.';
}
</script>
